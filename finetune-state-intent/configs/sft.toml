# State→intent SFT lane (E2 after-lane). Trains on the (state, intent) pairs in
# dataset/train.jsonl (784 rows from buildStateIntentEval.js) so the deployed
# adapter emits D1 tool calls from a game-state window — the task
# intentEval.js measures before/after.
#
# This config lives in its OWN freesolo env folder (finetune-state-intent/),
# published separately from the wiki-QA lane (finetune/). The two folders share
# no files: pushing from here uploads ONLY the intent data, so the QA lane's
# train.jsonl can never contaminate this env.
#
# Qwen3.5-9B matches the "before" baseline (OpenRouter qwen/qwen3.5-9b) and the
# QA lane's choice; freesolo has no Qwen3, so 9B is the smallest exact match.
model = "Qwen/Qwen3.5-9B"
algorithm = "sft"

# Environment: this lane trains on dataset/train.jsonl with the intent system
# message (system_message.txt) and a tool-name reward. flash loads
# `load_environment()` from environment.py directly — no file-swapping. Push
# with `flash env push --name frlg-state-intent .` from this folder, then paste
# the returned id below and `flash train configs/sft.toml`. Re-push after ANY
# edit to environment.py, system_message.txt, or dataset/.
[environment]
id = "thundr/frlg-state-intent"  # placeholder — replace with the push output

[train]
epochs = 3
# Complementary ~80% of state_intent.jsonl (held-out eval = the other 197, never
# trained on — see dataset/eval_index.json). Do NOT train on all 981 or the
# before/after comparison is contaminated.
max_examples = 784
# The intent system message (system_message.txt, the D1 interface doc) is
# ~1295 tokens vs the QA lane's ~116, so every rendered prompt (sys + state
# window) is 1380–1798 tokens. Without this cap flash's default sft_max_len
# (~1024) truncates the rendered sequence before the short (32–59 tok) completion,
# erroring "every SFT example has an empty completion after sft_max_len
# truncation". 2048 clears the 1839-tok max total (measured with tiktoken) with
# ~160 tok chat-template headroom; 4096 also works but 4× the cost ($2.83 vs
# $1.42) because flash packs into max_context_tokens-sized bins regardless of
# real sequence length.
max_context_tokens = 2048
lora_rank = 32
# GPU and HF artifacts are managed automatically by the platform.
